<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Assignment Submission Portal</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; }
    label { display: block; margin: 10px 0 4px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 14px; padding: 10px 18px; cursor: pointer; }
    .errors { background: #fde8e8; color: #9b1c1c; padding: 10px 28px; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <h1>Assignment Submission Portal</h1>

  {% if errors %}
  <ul class="errors">
    {% for msg in errors.values() %}<li>{{ msg }}</li>{% endfor %}
  </ul>
  {% endif %}

  <form method="post" novalidate>
    <label>Name</label>
    <input name="name" value="{{ form.get('name', '') }}">
    <label>Registration Number</label>
    <input name="reg_no" value="{{ form.get('reg_no', '') }}">
    <label>Assignment Title</label>
    <input name="title" value="{{ form.get('title', '') }}">
    <label>Submission URL</label>
    <input name="url" value="{{ form.get('url', '') }}">
    <button type="submit">Submit</button>
  </form>

  <h2>Saved Submissions</h2>
  <table>
    <tr><th>Name</th><th>Reg No</th><th>Title</th><th>URL</th></tr>
    {% for s in submissions %}
    <tr>
      <td>{{ s.name }}</td><td>{{ s.reg_no }}</td><td>{{ s.title }}</td>
      <td><a href="{{ s.url }}">{{ s.url }}</a></td>
    </tr>
    {% else %}
    <tr><td colspan="4">No submissions yet.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
